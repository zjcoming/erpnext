name: erpnext-v16-development

services:
  init-permissions:
    image: docker.io/frappe/bench@sha256:85bd55c881bc99948c59ac3efc12cfb80e88b785952876b932a96d74b27c8538
    user: root
    working_dir: /workspace/erpnext
    volumes:
      - .:/workspace/erpnext:cached
    command:
      - bash
      - -lc
      - |
        mkdir -p \
          /workspace/erpnext/development \
          /workspace/erpnext/development/sites \
          /workspace/erpnext/development/logs
        chown frappe:frappe \
          /workspace/erpnext/development \
          /workspace/erpnext/development/sites \
          /workspace/erpnext/development/logs

  mariadb:
    image: docker.io/mariadb@sha256:be1ef4fe5f14589325c08a41c76334097ce66c86264b75e1d28342c742782a61
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: "123"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20

  redis-cache:
    image: docker.io/redis@sha256:09160599abd229764c0fb44cb6be640294e1d360a54b19985ab4843dcf2d90f1

  redis-queue:
    image: docker.io/redis@sha256:09160599abd229764c0fb44cb6be640294e1d360a54b19985ab4843dcf2d90f1

  frappe:
    image: docker.io/frappe/bench@sha256:85bd55c881bc99948c59ac3efc12cfb80e88b785952876b932a96d74b27c8538
    working_dir: /workspace/erpnext
    environment:
      SHELL: /bin/bash
      BENCH_NAME: frappe-bench
      SITE_NAME: development.localhost
      ADMIN_PASSWORD: admin
      DB_ROOT_PASSWORD: "123"
      FRAPPE_BRANCH: v16.32.0
      FRAPPE_COMMIT: "5cba016e86b54b57f34a3864282b92300ef20fb0"
      FRAPPE_VERSION: "16.32.0"
      ERPNEXT_VERSION: "16.33.0"
    volumes:
      - .:/workspace/erpnext:cached
      - ./development/sites:/sites:cached
      - ./development/logs:/logs:cached
      - ${HOME}/.ssh:/home/frappe/.ssh:ro,cached
    ports:
      - "8000:8000"
      - "9000:9000"
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    command:
      - bash
      - -lc
      - |
        set -euo pipefail

        mkdir -p /workspace/erpnext/development

        if [ ! -d "/workspace/erpnext/development/$$BENCH_NAME/apps/frappe" ]; then
          (
            cd /tmp
            bench init \
              --skip-redis-config-generation \
              --frappe-path=https://github.com/frappe/frappe \
              --frappe-branch="$$FRAPPE_BRANCH" \
              --dev \
              "/workspace/erpnext/development/$$BENCH_NAME"
          )
        fi

        cd "/workspace/erpnext/development/$$BENCH_NAME"

        if ! git -C apps/frappe diff --quiet || ! git -C apps/frappe diff --cached --quiet; then
          echo "apps/frappe has local changes; refusing to replace the pinned framework checkout." >&2
          exit 1
        fi

        if [ "$$(git -C apps/frappe rev-parse HEAD)" != "$$FRAPPE_COMMIT" ]; then
          if ! git -C apps/frappe cat-file -e "$${FRAPPE_COMMIT}^{commit}" 2>/dev/null; then
            git -C apps/frappe fetch --no-tags https://github.com/frappe/frappe.git "$$FRAPPE_COMMIT"
          fi
          git -C apps/frappe checkout --detach "$$FRAPPE_COMMIT"
        fi

        if ! grep -Fq "__version__ = \"$$FRAPPE_VERSION\"" apps/frappe/frappe/__init__.py; then
          echo "Pinned Frappe commit does not expose version $$FRAPPE_VERSION." >&2
          exit 1
        fi

        if ! grep -Fq "__version__ = \"$$ERPNEXT_VERSION\"" /workspace/erpnext/erpnext/__init__.py; then
          echo "Mounted ERPNext source is not version $$ERPNEXT_VERSION." >&2
          exit 1
        fi

        if [ ! -L sites ]; then
          if [ -d sites ] && [ -z "$$(find /sites -mindepth 1 -maxdepth 1 2>/dev/null)" ]; then
            cp -a sites/. /sites/
          fi
          rm -rf sites
          ln -s /sites sites
        fi

        if [ ! -L logs ]; then
          if [ -d logs ] && [ -z "$$(find /logs -mindepth 1 -maxdepth 1 2>/dev/null)" ]; then
            cp -a logs/. /logs/
          fi
          rm -rf logs
          ln -s /logs logs
        fi

        bench set-config -g db_host mariadb
        bench set-config -g redis_cache redis://redis-cache:6379
        bench set-config -g redis_queue redis://redis-queue:6379
        bench set-config -g redis_socketio redis://redis-queue:6379

        if [ ! -e apps/erpnext ]; then
          ln -s /workspace/erpnext apps/erpnext
        fi

        if [ "$$(readlink apps/erpnext || true)" != "/workspace/erpnext" ] && [ ! -d apps/erpnext/.git ]; then
          echo "apps/erpnext exists but is not the expected local source mount." >&2
          exit 1
        fi

        if ! grep -qx "erpnext" sites/apps.txt; then
          printf '\nerpnext\n' >> sites/apps.txt
        fi

        ./env/bin/pip install -e apps/frappe
        ./env/bin/pip install -e apps/erpnext
        yarn install --check-files --frozen-lockfile --ignore-scripts --cwd apps/erpnext
        yarn install --frozen-lockfile --cwd apps/erpnext/banking

        for custom_app in /workspace/erpnext/custom_apps/*; do
          if [ -f "$$custom_app/pyproject.toml" ]; then
            custom_app_name="$$(basename "$$custom_app")"
            if [ ! -e "apps/$$custom_app_name" ]; then
              ln -s "$$custom_app" "apps/$$custom_app_name"
            fi
            if ! grep -qx "$$custom_app_name" sites/apps.txt; then
              printf '\n%s\n' "$$custom_app_name" >> sites/apps.txt
            fi
            ./env/bin/pip install -e "apps/$$custom_app_name"
          fi
        done

        if [ ! -d "sites/$$SITE_NAME" ]; then
          bench new-site \
            --mariadb-user-host-login-scope=% \
            --db-root-username=root \
            --db-root-password="$$DB_ROOT_PASSWORD" \
            --admin-password="$$ADMIN_PASSWORD" \
            --install-app erpnext \
            "$$SITE_NAME"
        fi

        bench --site "$$SITE_NAME" set-config developer_mode 0

        for custom_app in /workspace/erpnext/custom_apps/*; do
          if [ -f "$$custom_app/pyproject.toml" ]; then
            custom_app_name="$$(basename "$$custom_app")"
            if ! bench --site "$$SITE_NAME" list-apps | grep -q "^$$custom_app_name"; then
              bench --site "$$SITE_NAME" install-app "$$custom_app_name"
            fi
            bench build --app "$$custom_app_name" --force || true
            bench compile-po-to-mo --app "$$custom_app_name" --locale zh --force || true
          fi
        done

        bench --site "$$SITE_NAME" migrate
        bench build --force

        bench compile-po-to-mo --app frappe --locale zh --force || true
        bench compile-po-to-mo --app erpnext --locale zh --force || true
        bench --site "$$SITE_NAME" set-config developer_mode 0
        bench --site "$$SITE_NAME" execute process_simplification.install.set_default_language || true
        bench --site "$$SITE_NAME" enable-scheduler || true
        bench --site "$$SITE_NAME" clear-cache
        bench --site "$$SITE_NAME" clear-website-cache || true

        {
          echo "web: bench --site $$SITE_NAME serve --port 8000"
          echo
          echo "socketio: node apps/frappe/socketio.js"
          echo
          echo "schedule: bench schedule"
          echo "worker: bench worker 1>> logs/worker.log 2>> logs/worker.error.log"
        } > Procfile.docker

        exec bench start --procfile Procfile.docker

volumes:
  mariadb-data:
